services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fbd
      POSTGRES_PASSWORD: fbd
      POSTGRES_DB: futboosterdraft
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbd -d futboosterdraft"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interfaz web del buzón de pruebas

volumes:
  db-data:
